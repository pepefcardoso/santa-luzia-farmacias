<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando...</title>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-SEU_ID_AQUI"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "AW-SEU_ID_AQUI");

      const NUMERO_WHATSAPP = "5511999999999";
      const MENSAGEM =
        "Olá! Vim pelo anúncio do Google e gostaria de mais informações.";

      function redirecionar() {
        window.location.href = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(MENSAGEM)}`;
      }

      gtag("event", "conversion", {
        send_to: "AW-SEU_ID_AQUI/LABEL_DA_CONVERSAO_AQUI",
        event_callback: redirecionar,
      });

      setTimeout(redirecionar, 1500);
    </script>
  </head>
  <body>
    <p>Redirecionando para o WhatsApp...</p>
  </body>
</html>
